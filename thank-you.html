<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thank You — Satvik Manaktala</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><style>body{min-height:100vh;display:grid;place-items:center}.thanks{width:min(700px,calc(100% - 34px));text-align:center;padding:70px 25px}.thanks .eyebrow{font-size:12px;letter-spacing:.18em;font-weight:800;color:var(--muted)}.thanks h1{font-size:clamp(48px,7vw,82px);line-height:.98;letter-spacing:-.055em;margin:18px 0 24px}.thanks h1 em{font-family:'Playfair Display',serif;font-weight:500}.thanks p{color:var(--muted);font-size:17px;max-width:520px;margin:0 auto 32px}.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--brown);color:white;border:1px solid var(--brown);padding:15px 24px;border-radius:999px;font-weight:700;font-size:14px}</style></head><body><main class="thanks"><div class="eyebrow">THANK YOU</div><h1>Your message is <em>on its way.</em></h1><p>Thanks for reaching out. I’ll get back to you on email as soon as possible.</p><a class="btn" href="/">Back to website ↗</a></main></body></html>
